# Configuração usada SOMENTE nos testes (substitui o application.properties principal).
# Banco H2 em memória: os testes não precisam do PostgreSQL nem do Docker.
spring.datasource.url=jdbc:h2:mem:servicehub-test;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
spring.datasource.username=sa
spring.datasource.password=

# O schema do H2 é criado pelo Hibernate; o Flyway (migrations do PostgreSQL) fica desligado
spring.flyway.enabled=false
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.open-in-view=false

app.jwt.secret=segredo-somente-para-testes-com-mais-de-32-caracteres
app.jwt.expiration-ms=3600000
app.seed.enabled=false

spring.graphql.path=/graphql
spring.graphql.graphiql.enabled=false
