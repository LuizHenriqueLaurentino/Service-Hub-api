services:
  db:
    image: postgres:15
    container_name: servicehub-postgres
    environment:
      POSTGRES_USER: servicehub
      POSTGRES_PASSWORD: secret
      POSTGRES_DB: servicehub
    ports:
      - "5432:5432"
    volumes:
      - servicehub-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U servicehub -d servicehub"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  servicehub-data:
