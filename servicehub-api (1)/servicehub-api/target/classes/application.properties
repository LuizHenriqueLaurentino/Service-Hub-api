# ===== ServiceHub API =====
spring.application.name=servicehub-api
server.port=8080

# ===== DataSource (PostgreSQL) =====
# Os valores padrao batem com o docker-compose.yml. Para outro ambiente,
# defina as variaveis DB_URL, DB_USER e DB_PASSWORD.
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/servicehub}
spring.datasource.username=${DB_USER:servicehub}
spring.datasource.password=${DB_PASSWORD:secret}

# ===== JPA / Hibernate =====
# O schema e criado pelo Flyway; o Hibernate apenas valida.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# ===== Flyway =====
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# ===== SpringDoc / Swagger UI =====
# Swagger UI: http://localhost:8080/swagger-ui.html
# Especificacao OpenAPI: http://localhost:8080/v3/api-docs
springdoc.swagger-ui.operations-sorter=method
springdoc.swagger-ui.tags-sorter=alpha
springdoc.swagger-ui.doc-expansion=list
springdoc.swagger-ui.display-request-duration=true
